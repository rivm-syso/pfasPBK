validation_scenarios:
  - id: PFOS_oral_repeated
    model_path: ./model/PBK_PFAS_LT.ant
    param_file: ./validation/params_LT_validation_PFOS.csv
    r_validation_script: 'validation/R_model/run_westerhout_2024.R'
    r_output_file: 'validation/results/results_R_PFAS.csv'
    duration: 28500 # 80 * 365.25
    evaluation_resolution: 1
    dosing_events:
      - id: oral_repeated
        target: AGut
        until: 28500
        amount: 0.001 # ug/day
    type: 'oral_dosing'
    comparisons:
      - id: CArt
        label: Concentration arterial plasma PFOS (ug/L)
        output_id_r: Cart_PFOS
        output_id_ant: "[AArt_Plas]"
      - id: CVen
        label: Concentration venous plasma PFOS (ug/L)
        output_id_r: Cven_PFOS
        output_id_ant: "[AVen_Plas]"
      - id: CLiv
        label: Concentration liver PFOS (ug/L)
        output_id_r: CL_PFOS
        output_id_ant: "[ALiv]"
      - id: BW
        label: Bodyweight
        output_id_r: BW
        output_id_ant: BW

  - id: PFOA_oral_repeated
    model_path: ./model/PBK_PFAS_LT.ant
    param_file: ./validation/params_LT_validation_PFOA.csv
    r_validation_script: 'validation/R_model/run_westerhout_2024.R'
    r_output_file: 'validation/results/results_R_PFAS.csv'
    duration: 28500 # 80 * 365.25
    evaluation_resolution: 1
    dosing_events:
      - id: oral_repeated
        target: AGut
        until: 28500
        amount: 0.001 # ug/day
    comparisons:
      - id: CArt
        label: Concentration arterial plasma PFOA (ug/L)
        output_id_r: Cart_PFOA
        output_id_ant: "[AArt_Plas]"
      - id: CVen
        label: Concentration venous plasma PFOA (ug/L)
        output_id_r: Cven_PFOA
        output_id_ant: "[AVen_Plas]"
      - id: CLiv
        label: Concentration liver PFOA (ug/L)
        output_id_r: CL_PFOA
        output_id_ant: "[ALiv]"

  - id: PFOA_no_dosing
    model_path: ./model/PBK_PFAS_LT.ant
    param_file: ./validation/params_LT_validation_PFOA.csv
    r_validation_script: 'validation/R_model/run_westerhout_2024_no_dosing.R'
    r_output_file: 'validation/results/results_R_PFAS_no_dosing.csv'
    duration: 5
    evaluation_resolution: 24
    initial_amounts:
      - target: ALiv
        amount: 100 # ug
    comparisons:
      - id: CArt
        label: Concentration arterial plasma PFOA (ug/L)
        output_id_r: Cart_PFOA
        output_id_ant: "[AArt_Plas]"
      - id: AArt
        label: Amount in arterial plasma PFOA (ug)
        output_id_r: Aart_PFOA
        output_id_ant: "AArt_Plas"
      - id: CVen
        label: Concentration venous plasma PFOA (ug/L)
        output_id_r: Cven_PFOA
        output_id_ant: "[AVen_Plas]"
      - id: CLiv
        label: Concentration liver PFOA (ug/L)
        output_id_r: CL_PFOA
        output_id_ant: "[ALiv]"
      - id: ALiv
        label: Concentration liver PFOA (ug/L)
        output_id_r: AL_PFOA
        output_id_ant: "ALiv"
